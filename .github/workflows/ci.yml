name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tooling
  layout-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix /tmp/espresense-browser --no-package-lock playwright@1.57.0
      - run: /tmp/espresense-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/test_layout_browser.cjs
        env:
          NODE_PATH: /tmp/espresense-browser/node_modules
