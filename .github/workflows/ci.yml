name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  spec-kit-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Spec Kit scripts in an isolated worktree
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_specify_scripts.ps1
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify policy and secret scanner rejection cases
        run: python -m unittest discover -s tests -p test_governance.py -v
        env:
          GITLEAKS_EXECUTABLE: gitleaks
      - run: python tooling/governance/check_repository.py
      - name: Scan checkout and complete reachable history
        run: |
          gitleaks dir . --config .gitleaks.toml --redact=100 --no-banner
          gitleaks git . --config .gitleaks.toml --redact=100 --no-banner --log-opts="--all"
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tooling
  layout-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix /tmp/espresense-browser --no-package-lock playwright@1.57.0
      - run: /tmp/espresense-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/test_layout_browser.cjs
        env:
          NODE_PATH: /tmp/espresense-browser/node_modules
